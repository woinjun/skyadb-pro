name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      ENHANCED_APPLICATION_ID: ${{ vars.ENHANCED_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source version.properties
          [[ "$GITHUB_REF_NAME" == "v$VERSION_NAME" ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          (( VERSION_CODE > 101069 && VERSION_CODE <= 2100000000 ))
          [[ "$ENHANCED_APPLICATION_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$ ]]
          [[ "$ENHANCED_APPLICATION_ID" != com.sky22333.skyadb ]]
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            old=$(git show "$previous:version.properties" 2>/dev/null | sed -n 's/^VERSION_CODE=//p' || true)
            if [[ -n "$old" ]]; then (( VERSION_CODE > old )); fi
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEY_BASE64 KEY_ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "::error::Missing signing secret $key"; exit 1; }
          done
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Test and build
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease 2>&1 | tee build.log
      - name: Verify and checksum
        run: |
          set -euo pipefail
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SkyADB-Enhanced-$GITHUB_REF_NAME.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "SkyADB Enhanced $GITHUB_REF_NAME" --generate-notes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: |
            build.log
            app/build/reports/
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
